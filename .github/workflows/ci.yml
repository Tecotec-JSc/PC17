name: PC17 CI

on:
  push:
    branches-ignore:
      - main
      # ci/** tự merge qua auto-merge-ci-config.yml, không cần chạy full pipeline
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Bỏ qua build'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  # false để không hủy UI test đang chạy giữa chừng khi có commit mới
  cancel-in-progress: false

env:
  DOTNET_VERSION:   "8.0.x"
  SOLUTION_PATH:    "T3ACS/T3ACS.sln"
  PROJECT_PATH:     "T3ACS/T3ACS/T3ACS.csproj"
  TEST_PATH:        "T3ACS/T3ACS.Tests/T3ACS.Tests.csproj"
  INT_TEST_PATH:    "T3ACS/T3ACS.IntegrationTests/T3ACS.IntegrationTests.csproj"
  UI_TEST_PATH:     "T3ACS/T3ACS.UITests/T3ACS.UITests.csproj"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 0: Skip Check
  # Cải tiến: đổi sang ubuntu-latest (nhanh hơn, rẻ hơn windows-latest)
  # ═══════════════════════════════════════════════════════════════
  skip-check:
    name: Skip Check
    runs-on: ubuntu-latest
    outputs:
      no_ci:                ${{ steps.check.outputs.no_ci }}
      no_build:             ${{ steps.check.outputs.no_build }}
      short_sha:            ${{ steps.check.outputs.short_sha }}
      actor:                ${{ steps.check.outputs.actor }}
      has_tests:            ${{ steps.check.outputs.has_tests }}
      has_integration_tests: ${{ steps.check.outputs.has_integration_tests }}
      has_ui_tests:         ${{ steps.check.outputs.has_ui_tests }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Read commit message & set flags
        id: check
        run: |
          msg=$(git log -1 --pretty=%B)
          shortSha=$(git rev-parse --short HEAD)
          echo "Commit: $msg"

          echo "short_sha=$shortSha"       >> $GITHUB_OUTPUT
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT

          if echo "$msg" | grep -q "no-ci"; then
            echo "no-ci — dừng pipeline"
            echo "no_ci=true"  >> $GITHUB_OUTPUT
          else
            echo "no_ci=false" >> $GITHUB_OUTPUT
          fi

          skipBuild=false
          if [ "${{ inputs.skip_build }}" = "true" ] || echo "$msg" | grep -q "no-build"; then
            echo "no-build — bỏ qua build"
            skipBuild=true
          fi
          echo "no_build=$skipBuild" >> $GITHUB_OUTPUT

          # Kiểm tra từng test project có tồn tại trong checkout không
          for key_path in \
            "has_tests=${{ env.TEST_PATH }}" \
            "has_integration_tests=${{ env.INT_TEST_PATH }}" \
            "has_ui_tests=${{ env.UI_TEST_PATH }}"; do
            key="${key_path%%=*}"
            path="${key_path#*=}"
            if [ -f "$path" ]; then
              echo "$key = true ($path)"
              echo "$key=true"  >> $GITHUB_OUTPUT
            else
              echo "$key = false (không tìm thấy $path)"
              echo "$key=false" >> $GITHUB_OUTPUT
            fi
          done

  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Unit Tests
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: skip-check
    if: |
      needs.skip-check.outputs.no_ci    != 'true' &&
      needs.skip-check.outputs.no_build != 'true' &&
      needs.skip-check.outputs.has_tests == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET + cache NuGet
        uses: ./.github/actions/setup-dotnet-cache
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test ${{ env.TEST_PATH }} `
            --configuration Release `
            --logger "trx;LogFileName=unit-test-results.trx" `
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Integration Tests
  # Chạy song song với build — không cần EXE đã publish
  # ═══════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    runs-on: windows-latest
    needs: skip-check
    if: |
      needs.skip-check.outputs.no_ci                != 'true' &&
      needs.skip-check.outputs.no_build             != 'true' &&
      needs.skip-check.outputs.has_integration_tests == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET + cache NuGet
        uses: ./.github/actions/setup-dotnet-cache
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run integration tests
        shell: pwsh
        run: |
          dotnet test ${{ env.INT_TEST_PATH }} `
            --configuration Release `
            --logger "trx;LogFileName=integration-test-results.trx" `
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Build Windows EXE
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [skip-check]
    if: |
      needs.skip-check.outputs.no_ci    != 'true' &&
      needs.skip-check.outputs.no_build != 'true'
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET + cache NuGet
        uses: ./.github/actions/setup-dotnet-cache
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Check for vulnerable packages
        shell: pwsh
        run: dotnet list ${{ env.PROJECT_PATH }} package --vulnerable --include-transitive

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}.0"
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:AssemblyVersion=$version `
            -p:FileVersion=$version `
            --output publish/ `
            2>&1 | Tee-Object build-output.txt

      - name: Set artifact metadata
        id: meta
        shell: pwsh
        run: |
          $short  = "${{ needs.skip-check.outputs.short_sha }}"
          $branch = "${{ github.ref_name }}" -replace "/", "-"
          $name   = "PC17-${branch}-${short}"
          "artifact_name=$name" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: publish/
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          retention-days: 7

      - name: Write Step Summary
        if: always()
        shell: pwsh
        run: |
          $short    = "${{ needs.skip-check.outputs.short_sha }}"
          $artifact = "${{ steps.meta.outputs.artifact_name }}"
          $version  = "1.0.${{ github.run_number }}.0"
          @"
          ## 🏗️ Build Result

          | | |
          |---|---|
          | Branch   | ``${{ github.ref_name }}`` |
          | Commit   | ``$short`` |
          | Actor    | ``${{ needs.skip-check.outputs.actor }}`` |
          | Artifact | ``$artifact`` |
          | Version  | ``$version`` |
          | Runtime  | win-x64 self-contained |
          | Retention | 14 ngày |
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

  # ═══════════════════════════════════════════════════════════════
  # JOB 4: UI Automation Tests (FlaUI)
  # Chạy SAU build — cần EXE đã được publish
  # ═══════════════════════════════════════════════════════════════
  ui-test:
    name: UI Automation Tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [skip-check, build]
    if: |
      needs.skip-check.outputs.no_ci    != 'true'  &&
      needs.skip-check.outputs.no_build != 'true'  &&
      needs.skip-check.outputs.has_ui_tests == 'true' &&
      needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET + cache NuGet
        uses: ./.github/actions/setup-dotnet-cache
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./app

      - name: Copy seed database vào thư mục app
        shell: pwsh
        run: |
          # T3.db phải tồn tại trong app dir trước khi test chạy
          # TestDataSeeder đọc DUT từ DB này, sau đó tự seed template
          Copy-Item "T3ACS\T3ACS.UITests\SeedData\T3.db" -Destination "app\T3.db"

      - name: Set license registry key cho CI
        shell: pwsh
        run: |
          # Ghi license key vào registry HKCU\SOFTWARE\T3\KeyLicenseT3ACS dưới dạng UTF-8 bytes
          # (T3.Configuration.Registry lưu bằng UTF8Encoding.GetBytes nên phải ghi Binary)
          $keyPath = "HKCU:\SOFTWARE\T3"
          if (-not (Test-Path $keyPath)) { New-Item -Path $keyPath -Force | Out-Null }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("${{ secrets.T3ACS_LICENSE_KEY }}")
          Set-ItemProperty -Path $keyPath -Name "KeyLicenseT3ACS" -Value $bytes -Type Binary
          Write-Host "Đã ghi KeyLicenseT3ACS ($($bytes.Length) bytes) vào $keyPath"

      - name: Run UI automation tests (with screen recording)
        env:
          T3ACS_UI_TEST_APP_DIR: ${{ github.workspace }}\app
        shell: pwsh
        run: |
          # Bắt đầu ghi màn hình bằng ffmpeg (có sẵn trên windows-latest)
          $ffmpeg = [System.Diagnostics.Process]::new()
          $ffmpeg.StartInfo.FileName      = "ffmpeg"
          $ffmpeg.StartInfo.Arguments     = "-f gdigrab -framerate 5 -video_size 1920x1080 -i desktop -vf scale=1280:720 -vcodec libx264 -preset ultrafast -pix_fmt yuv420p ui-test-recording.mp4"
          $ffmpeg.StartInfo.UseShellExecute    = $false
          $ffmpeg.StartInfo.RedirectStandardInput = $true
          $ffmpeg.StartInfo.RedirectStandardError = $true
          $ffmpeg.Start() | Out-Null
          Start-Sleep -Seconds 2   # đợi ffmpeg khởi động xong

          $testExitCode = 0
          try {
            dotnet test ${{ env.UI_TEST_PATH }} `
              --configuration Release `
              --blame-hang-timeout 2m `
              --logger "trx;LogFileName=ui-test-results.trx" `
              --results-directory ./test-results
            $testExitCode = $LASTEXITCODE
          } finally {
            # Gửi 'q' để ffmpeg finalize MP4 đúng cách (không bị corrupt)
            try {
              $ffmpeg.StandardInput.WriteLine("q")
              $ffmpeg.WaitForExit(15000)
            } catch { }
            if (-not $ffmpeg.HasExited) { $ffmpeg.Kill() }
          }

          exit $testExitCode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ./test-results/*.trx
          retention-days: 7

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-recording
          path: ui-test-recording.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ./app/_screens/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # JOB 5: Pipeline Summary — luôn chạy
  # ═══════════════════════════════════════════════════════════════
  report:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [skip-check, test, integration-test, build, ui-test]
    if: always() && needs.skip-check.outputs.no_ci != 'true'
    permissions:
      pull-requests: write

    steps:
      - name: Download test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-test-results"
          path: ./test-results
          merge-multiple: false
        continue-on-error: true

      - name: Write final summary & notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT:    ${{ needs.build.result }}
          TEST_RESULT:     ${{ needs.test.result }}
          INT_RESULT:      ${{ needs.integration-test.result }}
          UI_RESULT:       ${{ needs.ui-test.result }}
          ARTIFACT:        ${{ needs.build.outputs.artifact_name }}
          SHORT_SHA:       ${{ needs.skip-check.outputs.short_sha }}
          BRANCH:          ${{ github.ref_name }}
          ACTOR:           ${{ needs.skip-check.outputs.actor }}
          RUN_ID:          ${{ github.run_id }}
          REPO:            ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, json, glob, subprocess, tempfile
          import xml.etree.ElementTree as ET

          NS = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"

          def parse_trx(pattern):
              """Đọc file TRX, trả về (passed, total) hoặc None nếu không có."""
              files = glob.glob(f"./test-results/{pattern}/*.trx")
              if not files:
                  return None
              try:
                  root = ET.parse(files[0]).getroot()
                  c = root.find(f".//{{{NS}}}Counters")
                  if c is not None:
                      return int(c.get("passed", 0)), int(c.get("total", 0))
              except Exception:
                  pass
              return None

          def fmt_badge(result):
              return {"success": "✅", "failure": "❌", "skipped": "⏭️"}.get(result, "⚠️")

          def fmt_count(counts, result):
              icon = fmt_badge(result)
              if counts is None:
                  return f"{icon} —"
              passed, total = counts
              return f"{icon} {passed}/{total}"

          unit_counts = parse_trx("unit-test-results")
          int_counts  = parse_trx("integration-test-results")
          ui_counts   = parse_trx("ui-test-results")

          build  = os.environ["BUILD_RESULT"]
          test   = os.environ["TEST_RESULT"]
          intg   = os.environ["INT_RESULT"]
          ui     = os.environ["UI_RESULT"]
          all_ok = all(r in ("success", "skipped") for r in [build, test, intg, ui])

          # ── GitHub Step Summary ─────────────────────────────────────
          overall = "✅ PASSED" if all_ok else "❌ FAILED"
          summary_lines = [
              "---",
              f"## {overall} — PC17 Pipeline",
              "",
              "| Job | Kết quả | Tests |",
              "|-----|---------|-------|",
              f"| Unit Tests        | {fmt_badge(test)}  {test}  | {fmt_count(unit_counts, test)} |",
              f"| Integration Tests | {fmt_badge(intg)}  {intg}  | {fmt_count(int_counts,  intg)} |",
              f"| UI Automation     | {fmt_badge(ui)}    {ui}    | {fmt_count(ui_counts,   ui)}   |",
              f"| Build Windows EXE | {fmt_badge(build)} {build} | — |",
              "",
              f"**Artifact:** `{os.environ['ARTIFACT']}`  ",
              f"**Commit:** `{os.environ['SHORT_SHA']}` by {os.environ['ACTOR']}  ",
              f"**Branch:** `{os.environ['BRANCH']}`",
              "",
              "### Tải EXE",
              f"> Actions tab → chọn run này → kéo xuống **Artifacts** → tải `{os.environ['ARTIFACT']}`",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("\n".join(summary_lines) + "\n")

          # ── Discord notification ────────────────────────────────────
          def discord_field(counts, result, label):
              icon = fmt_badge(result)
              if counts:
                  passed, total = counts
                  val = f"{icon} {passed}/{total} passed"
              else:
                  val = f"{icon} {result}"
              return {"name": label, "value": val, "inline": True}

          run_url = f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          title   = "✅ PC17 CI PASSED" if all_ok else "❌ PC17 CI FAILED"
          color   = 3066993 if all_ok else 15158332

          payload = {
              "embeds": [{
                  "title": title,
                  "color": color,
                  "fields": [
                      {"name": "Branch", "value": f"`{os.environ['BRANCH']}`",    "inline": True},
                      {"name": "Commit", "value": f"`{os.environ['SHORT_SHA']}`", "inline": True},
                      {"name": "Author", "value": os.environ["ACTOR"],            "inline": True},
                      discord_field(unit_counts, test,  "Unit Tests"),
                      discord_field(int_counts,  intg,  "Integration"),
                      discord_field(ui_counts,   ui,    "UI Automation"),
                      {"name": "Build EXE", "value": f"{fmt_badge(build)} {build}", "inline": True},
                  ],
                  "url": run_url,
                  "footer": {"text": "Click title → xem log chi tiết"}
              }]
          }

          # Dùng curl thay urllib — tránh Cloudflare 1010 chặn Python-urllib
          with tempfile.NamedTemporaryFile(mode="w", suffix=".json", delete=False) as f:
              json.dump(payload, f)
              tmp = f.name

          result = subprocess.run(
              ["curl", "-s", "-o", "/dev/stderr", "-w", "%{http_code}",
               "-X", "POST", os.environ["DISCORD_WEBHOOK"],
               "-H", "Content-Type: application/json",
               "-H", "User-Agent: DiscordBot (https://github.com/Tecotec-JSc/PC17, 1.0)",
               "--data", f"@{tmp}"],
              capture_output=True, text=True)
          print(f"Discord HTTP {result.stdout.strip()}")
          if result.stderr:
              print(f"Discord body: {result.stderr.strip()}")
          PYEOF

      - name: Comment on PR khi pipeline fail
        if: |
          github.event_name == 'pull_request' && (
            needs.build.result == 'failure' ||
            needs.test.result == 'failure' ||
            needs.integration-test.result == 'failure' ||
            needs.ui-test.result == 'failure'
          )
        uses: actions/github-script@v7
        with:
          script: |
            const badge = (r) => ({success:'✅', failure:'❌', skipped:'⏭️'})[r] ?? '⚠️';
            const count = (c, r) => c ? `${badge(r)} ${c[0]}/${c[1]}` : `${badge(r)} —`;

            // Đọc test counts từ env (được set bởi step trước qua GITHUB_ENV nếu cần)
            const build = '${{ needs.build.result }}';
            const test  = '${{ needs.test.result }}';
            const intg  = '${{ needs.integration-test.result }}';
            const ui    = '${{ needs.ui-test.result }}';
            const sha   = '${{ needs.skip-check.outputs.short_sha }}';
            const runId = '${{ github.run_id }}';
            const repo  = '${{ github.repository }}';

            const body = [
              '## ❌ CI Pipeline Failed',
              '',
              '| Job | Kết quả |',
              '|-----|---------|',
              `| Unit Tests        | ${badge(test)}  ${test}  |`,
              `| Integration Tests | ${badge(intg)}  ${intg}  |`,
              `| UI Automation     | ${badge(ui)}    ${ui}    |`,
              `| Build EXE         | ${badge(build)} ${build} |`,
              '',
              `**Commit:** \`${sha}\``,
              `**[Xem log chi tiết →](https://github.com/${repo}/actions/runs/${runId})**`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body
            });
